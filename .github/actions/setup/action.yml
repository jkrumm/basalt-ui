name: Setup
description: Node, Bun and the frozen install every ci.yml job starts from

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      # Built-in caching keyed on bun.lock

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
