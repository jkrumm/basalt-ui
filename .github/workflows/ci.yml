name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels the run in flight for the superseded head, so a hosted run is not billed for a
# head no longer on the pull request. A master run in flight is never cancelled, and the final head still runs the full gate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The workflow stays ci.yml and its run-level conclusion stays the single result `make merge-guard` reads
# (`gh run list --workflow ci.yml`): the parallel jobs below only cut wall time, and the final `ci` job
# fails unless every one of them passed.
jobs:
  # Static gates, build, typecheck, theme/coverage/budget gates and the pack test.
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint reads the pushed range

      - name: Setup
        uses: ./.github/actions/setup

      - name: Commitlint (pushed range)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # new-branch push: no previous tip, so lint what the branch adds over master (fetch-depth 0 brought origin/master)
            bunx commitlint --from origin/master --to HEAD
          else
            bunx commitlint --from "$BEFORE_SHA" --to "$PUSH_SHA"
          fi

      - name: oxlint config sync check
        run: bun packages/basalt-ui/scripts/gen-oxlint.ts --check

      - name: Format check (oxfmt)
        run: bun run fmt:check

      - name: Build package
        run: bun --filter basalt-ui build

      # After the build: the playground's preset loads `basalt-ui/lint`, which resolves through dist.
      - name: Lint (oxlint)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build playground (the review shots and the layout harness serve this build)
        run: bun --filter @basalt-ui/playground build

      - name: Build the expression app (the layout harness and the matrix serve this build)
        run: bun --filter @basalt-ui/expression build

      # The app profile's own proof on the repo's apps: the playground and the expression app are `init --profile app` installs.
      - name: basalt-ui doctor on apps/playground and apps/expression
        run: make playground-doctor expression-doctor

      - name: Coverage check (SURFACES projection gate)
        run: bun packages/basalt-ui/scripts/check-coverage.ts --check

      # The tarball half runs inside pack-test below.
      - name: Legacy names (the 2.x names, outside scripts/legacy-names.ts)
        run: bun scripts/check-legacy-names.ts

      - name: Agent doc drift check (removed-API guard on agent/**)
        run: bun packages/basalt-ui/scripts/check-agent-doc-drift.ts

      - name: Contract frozen check (pinned contract files)
        run: bun packages/basalt-ui/scripts/check-contract-frozen.ts

      - name: Budgets gate (symbols, subpaths, rule lines, spec prose, routes, CLI lines)
        run: bun packages/basalt-ui/scripts/check-budgets.ts

      - name: Pack test (dist resolution gate)
        run: bun --filter basalt-ui pack-test

  # The unit suite (happy-dom). Builds first, as the sequential job did.
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: bun --filter basalt-ui build

      - name: Tests
        # The factory's step host runs this suite at width 4 (scripts/unit-parallelism.ts); the hosted runner has the same 4 vCPUs.
        env:
          FACTORY_STEP_CORES: 4
          FACTORY_STEP_MEM_MIB: 16384
          UNIT_PEAK_MIB: 16384
        run: bun scripts/unit-test.ts

  # The CLI under Node with no Bun on PATH, at the engines.node floor (22.18, the first with type stripping on): Bun builds and packs the tarball, then a
  # scratch npm app runs init, sync, doctor and lint through the local bin, ages the install the way an
  # upgrade finds it, and proves sync heals it (packages/basalt-ui/scripts/node-cli-smoke.sh).
  node-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build and pack the package
        working-directory: packages/basalt-ui
        run: bun run build && bun pm pack

      - name: Setup Node.js 22.18.0 (the engines floor)
        uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'

      - name: init, sync, doctor and lint with no Bun on PATH
        working-directory: packages/basalt-ui
        run: |
          NODE_ONLY="$(mktemp -d)"
          for tool in node npm npx; do ln -s "$(command -v "$tool")" "$NODE_ONLY/$tool"; done
          env PATH="$NODE_ONLY:/usr/bin:/bin" bash scripts/node-cli-smoke.sh "$(ls basalt-ui-*.tgz)"

  # The site profile's proof (apps/marketing, basalt-ui.com): build the site on the built package and
  # hold its measured numbers to apps/marketing/site-budgets.json — zero module JavaScript on a page
  # without an island, the React runtime and island cost, CSS per page, LCP and CLS in a headless shell.
  site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # doctor's budget ratchet compares .basalt/budget.json with origin/master

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: bun --filter basalt-ui build

      - name: Build the marketing site
        run: bun --filter marketing build

      # Every Starlight and Expressive Code color variable in the built docs CSS resolves to a --basalt-* token.
      - name: Docs palette
        run: bun apps/marketing/scripts/docs-palette.ts

      # The site profile's own proof: sync places the sibling install's gitignored root copies and must
      # leave every committed file in apps/marketing as it is (a stale preset fails here), then doctor passes.
      - name: basalt-ui doctor on apps/marketing
        working-directory: apps/marketing
        run: ./node_modules/.bin/basalt-ui sync && git diff --exit-code -- . && ./node_modules/.bin/basalt-ui doctor

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install the headless shell
        run: make browser-shell

      - name: Site budgets (apps/marketing/site-budgets.json)
        run: bun apps/marketing/scripts/measure.ts --check --browser

  # The layout suite (real browser geometry), split by file across four jobs. `bun test --shard=i/N`
  # partitions the test files, so the shards together run exactly the files one run would; each prints
  # "Ran X tests across Y files", and Y must sum to the suite's file count (the `ci` job asserts it from the shard logs).
  layout:
    name: layout (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: bun --filter basalt-ui build

      # The suite runs on Playwright's chromium-headless-shell (BASALT_TEST_BROWSER defaults to shell), not the
      # runner's Chrome: measured identical results at about half the memory (AGENTS.md Gotchas). The cache key is the
      # lockfile, which pins playwright-core and so the browser revision; `make browser-shell` is the one install
      # step (a no-op on a hit) and fails here, readably, rather than as an opaque launch error 40 lines down.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install the headless shell
        run: make browser-shell

      - name: Layout tests (headless shell geometry)
        env:
          SHARD: ${{ matrix.shard }}/4
        # pipefail: the tee must not hide a failing run
        shell: bash
        run: bun run test:layout --shard="$SHARD" 2>&1 | tee "layout-shard-${{ matrix.shard }}.log"

      # Run even when the tests failed or this is not needed: the `ci` job reads the logs only when every shard passed.
      - name: Keep the shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-shard-${{ matrix.shard }}
          path: layout-shard-${{ matrix.shard }}.log
          if-no-files-found: ignore
          overwrite: true # a re-run of one failed shard uploads its log again

      - name: Layout harness self-test
        # One small file, not shardable: run it on the first shard only.
        if: matrix.shard == 1
        run: bun run test:layout:harness

  # What no other job runs: `make check CI_SPLIT=1`, which is `make ci-gate` (generated-file gates, the literal, recipe, README and playground-lint
  # checks, the guard-completeness gate and the test ledger). Every other step of `make check`
  # runs in `checks`, `unit` or a `layout` shard, so the whole of `check` runs once per head. There is no `factory`
  # on a hosted runner, so the slot wrapper is bare.
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-contract-frozen diffs against origin/master

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Gate steps no other job runs (make check CI_SPLIT=1)
        run: make check CI_SPLIT=1

  # The quality matrix (sampled, every playground route in real browser geometry), split across eight jobs: it is one file of
  # `test.each` cells, so `BASALT_MATRIX_SHARD=<i>/8` (tests/quality/matrix/shard.ts) keeps every eighth cell, not a file.
  # Each shard prints "matrix-shard <i>/8 ran=K total=T"; the `ci` job asserts the shards ran every cell of every matrix file.
  # It reads dist and the playground build, as `make check` does, and `make quality-matrix` installs the headless shell
  # itself (a no-op on a cache hit). There is no `factory` on a hosted runner, so the slot wrapper is bare.
  quality-matrix:
    name: quality-matrix (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: bun --filter basalt-ui build

      - name: Build playground (the matrix serves this build)
        run: bun --filter @basalt-ui/playground build

      - name: Build the expression app (the matrix serves this build)
        run: bun --filter @basalt-ui/expression build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Quality matrix (make quality-matrix, sampled, one shard)
        env:
          BASALT_MATRIX_SHARD: ${{ matrix.shard }}/8
        # pipefail: the tee must not hide a failing run
        shell: bash
        run: make quality-matrix 2>&1 | tee "quality-matrix-shard-${{ matrix.shard }}.log"

      # Run even when the tests failed: the `ci` job reads the logs only when every shard passed.
      - name: Keep the shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-matrix-shard-${{ matrix.shard }}
          path: quality-matrix-shard-${{ matrix.shard }}.log
          if-no-files-found: ignore
          overwrite: true # a re-run of one failed shard uploads its log again

  # The Astro matrix (docs/validation.md § Astro matrix): apps/playground-astro on the built package, every part in every
  # render mode measured in the headless shell and judged against docs/v3/verdicts/astro-matrix.json. It fails when a part
  # that was static-clean is not, a page passes its byte budget, or a page without an island loads a script.
  astro-matrix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: bun --filter basalt-ui build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install the headless shell
        run: make browser-shell

      - name: Astro matrix (build the Astro playground, measure, check against the record)
        run: make astro-matrix-run

      # The raw results, the measured table (matrix.md) and the pictures, to compare a run with the record's budgets.
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: astro-matrix
          path: apps/playground-astro/.astro-matrix
          if-no-files-found: ignore
          overwrite: true

  # The one result: needs every job above and fails unless each succeeded (a skipped or cancelled need is a
  # failure too), so a green ci.yml run still means everything passed.
  ci:
    if: always()
    needs: [checks, unit, node-cli, site, layout, gate, quality-matrix, astro-matrix]
    runs-on: ubuntu-latest

    steps:
      # The shards must sum to the whole suite: a shard that ran less than its share is a green run that skipped files.
      - name: Checkout
        if: needs.layout.result == 'success' || needs.quality-matrix.result == 'success'
        uses: actions/checkout@v7

      - name: Setup Bun (the scripts have no dependencies)
        if: needs.layout.result == 'success' || needs.quality-matrix.result == 'success'
        uses: oven-sh/setup-bun@v2

      - name: Download the shard logs
        if: needs.layout.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: layout-shard-*
          path: layout-logs
          merge-multiple: true

      - name: Layout shards sum to the suite
        if: needs.layout.result == 'success'
        run: bun scripts/check-layout-shards.ts layout-logs --shards 4

      - name: Download the quality-matrix shard logs
        if: needs.quality-matrix.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: quality-matrix-shard-*
          path: quality-matrix-logs
          merge-multiple: true

      - name: Quality-matrix shards run every cell
        if: needs.quality-matrix.result == 'success'
        run: bun scripts/check-matrix-shards.ts quality-matrix-logs --shards 8

      - name: Fail unless every job succeeded
        if: needs.checks.result != 'success' || needs.unit.result != 'success' || needs.node-cli.result != 'success' || needs.site.result != 'success' || needs.layout.result != 'success' || needs.gate.result != 'success' || needs.quality-matrix.result != 'success' || needs.astro-matrix.result != 'success'
        run: |
          echo "checks=${{ needs.checks.result }} unit=${{ needs.unit.result }} node-cli=${{ needs.node-cli.result }} site=${{ needs.site.result }} layout=${{ needs.layout.result }} gate=${{ needs.gate.result }} quality-matrix=${{ needs.quality-matrix.result }} astro-matrix=${{ needs.astro-matrix.result }}"
          exit 1

      - name: Every job succeeded
        run: echo "checks, unit, the CLI under Node, the site budgets, all layout shards, the gate, all quality-matrix shards and the Astro matrix passed"
