name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# The workflow stays ci.yml and its run-level conclusion stays the single result `make merge-guard` reads
# (`gh run list --workflow ci.yml`): the parallel jobs below only cut wall time, and the final `ci` job
# fails unless every one of them passed.
jobs:
  # Static gates, build, typecheck, theme/coverage/budget gates and the pack test.
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commitlint reads the pushed range

      - name: Setup
        uses: ./.github/actions/setup

      - name: Commitlint (pushed range)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # new-branch push: no previous tip, so lint what the branch adds over master (fetch-depth 0 brought origin/master)
            bunx commitlint --from origin/master --to HEAD
          else
            bunx commitlint --from "$BEFORE_SHA" --to "$PUSH_SHA"
          fi

      - name: oxlint config sync check
        run: bun packages/basalt-ui/scripts/gen-oxlint.ts --check

      - name: llms.txt sync check
        run: bun packages/basalt-ui/scripts/gen-llms.ts --check

      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run fmt:check

      - name: Build package
        run: bun --filter basalt-ui build

      - name: Typecheck
        run: bun run typecheck

      - name: Theme guard (dogfood check-theme on basalt's own src)
        working-directory: packages/basalt-ui
        run: bun ./bin/basalt-ui.mjs check-theme

      - name: Theme guard (playground)
        working-directory: apps/playground
        run: bun ../../packages/basalt-ui/bin/basalt-ui.mjs check-theme

      - name: Coverage check (SURFACES projection gate)
        run: bun packages/basalt-ui/scripts/check-coverage.ts --check

      - name: Agent doc drift check (removed-API guard on agent/**)
        run: bun packages/basalt-ui/scripts/check-agent-doc-drift.ts

      - name: Contract frozen check (pinned contract files)
        run: bun packages/basalt-ui/scripts/check-contract-frozen.ts

      - name: Budgets gate (symbols, subpaths, rule lines, spec prose, routes, CLI lines)
        run: bun packages/basalt-ui/scripts/check-budgets.ts

      - name: Pack test (dist resolution gate)
        run: bun --filter basalt-ui pack-test

  # The unit suite (happy-dom). Builds first, as the sequential job did.
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: bun --filter basalt-ui build

      - name: Tests
        run: bun test

  # The layout suite (real Chrome geometry), split by file across four jobs. `bun test --shard=i/N`
  # partitions the test files, so the shards together run exactly the files one run would; each prints
  # "Ran X tests across Y files", and X must sum to the unsharded count.
  layout:
    name: layout (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: bun --filter basalt-ui build

      - name: Layout tests (real Chrome geometry)
        env:
          SHARD: ${{ matrix.shard }}/4
        run: |
          # playwright-core's channel:'chrome' table resolves /opt/google/chrome/chrome on linux,
          # which is exactly what ubuntu-latest's Chrome .deb installs. Fail here with a readable
          # message rather than 40 lines down as an opaque launch error.
          CHROME=/opt/google/chrome/chrome
          if [ ! -x "$CHROME" ]; then
            echo "FAILED: no Chrome at $CHROME — playwright-core has nothing to launch."
            echo "        The runner image changed. Either restore Chrome, or switch this suite to"
            echo "        'bunx playwright-core install --only-shell chromium' and drop the channel."
            exit 1
          fi
          echo "==> driving $("$CHROME" --version)"
          bun run test:layout --shard="$SHARD"

      - name: Layout harness self-test
        # One small file, not shardable: run it on the first shard only.
        if: matrix.shard == 1
        run: bun run test:layout:harness

  # The one result: needs every job above and fails unless each succeeded (a skipped or cancelled need is a
  # failure too), so a green ci.yml run still means everything passed.
  ci:
    if: always()
    needs: [checks, unit, layout]
    runs-on: ubuntu-latest

    steps:
      - name: Fail unless every job succeeded
        if: needs.checks.result != 'success' || needs.unit.result != 'success' || needs.layout.result != 'success'
        run: |
          echo "checks=${{ needs.checks.result }} unit=${{ needs.unit.result }} layout=${{ needs.layout.result }}"
          exit 1

      - name: Every job succeeded
        run: echo "checks, unit and all layout shards passed"
