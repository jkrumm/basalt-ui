name: Newest peers

# Installs the newest version every peer range of packages/basalt-ui admits (scripts/newest-peers.ts), then runs the
# unit and pack tests. It reports a break the day a peer ships it and never gates a pull request: the ci job in
# ci.yml does not need it. On a schedule a red run is the report; on a pull request that edits this job it runs once
# with continue-on-error, so the result shows without blocking the merge.
#
# The one install here is deliberately not frozen: re-resolving to the newest in-range versions is the point. Nothing
# is committed from this checkout.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/newest-peers.yml
      - scripts/newest-peers.ts

permissions:
  contents: read

concurrency:
  group: newest-peers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newest-peers:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Move every peer to its newest in-range version
        run: |
          bun scripts/newest-peers.ts | tee newest-peers.txt
          {
            echo '### Peers moved to their newest in-range version'
            echo
            echo '```'
            cat newest-peers.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install (re-resolving, not frozen)
        run: bun install

      - name: Build package
        run: bun --filter basalt-ui build

      - name: Unit tests
        env:
          FACTORY_STEP_CORES: 4
          FACTORY_STEP_MEM_MIB: 16384
          UNIT_PEAK_MIB: 16384
        run: bun scripts/unit-test.ts

      - name: Pack test (every peer at its declared range)
        run: bun --filter basalt-ui pack-test
