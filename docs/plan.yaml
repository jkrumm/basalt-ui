# The v3 plan, run by the factory (docs/plan.md in software-factory). Adopted rows (key + issue) are the Issues already filed by hand;
# the others are filed by the server when their `after` rows are done. docs/v3/issues/ is the design record; this file wins on conflict.
# Not in this file: held rows (consumer migrations; re-cut and added after 3.0.0 is published), owner-run rows (v3-ga and the held
# verdict/cutover rows), v3-flags-delete-g2 (conditional on a spike verdict) and v3-marketing-docs-site with its dependents
# v3-marketing-recipes and v3-marketing-migration (owner-filed after 3.0.0). See docs/v3/PLAN-REVISION.md.
# A row's facts are the path of its file under docs/v3/issues/, the single source on master (the server caps this file at 64 KiB).
# A row's seat: opus high where index.json names an `opus` reason, sonnet medium for size s; no seat is the lead row (sonnet high).
