# The v3 plan, run by the factory (docs/plan.md in software-factory). Adopted rows (key + issue) are the Issues already filed by hand;
# the others are filed by the server when their `after` rows are done. docs/v3/issues/ is the design record; this file wins on conflict.
# Not in this file: held rows (consumer migrations; re-cut and added after 3.0.0 is published), owner-run rows (v3-ga and the held
# verdict/cutover rows), v3-flags-delete-g2 (conditional on a spike verdict) and v3-marketing-docs-site with its dependents
# v3-marketing-recipes and v3-marketing-migration (owner-filed after 3.0.0). See docs/v3/PLAN-REVISION.md.
# A row's facts are the path of its file under docs/v3/issues/, the single source on master (the server caps this file at 1 MiB).
# A row's seat: opus high where index.json names an `opus` reason, sonnet medium for size s; no seat is the lead row (sonnet high).
version: 1
rows:
  - key: ga-exports
    issue: 3163
  - key: ga-install-path
    title: 'The playground is a real init install on basalt(), the 2.x preset is gone, CI takes the tarball through init and build'
    repo: basalt-ui
    kind: chore
    seat: { tier: opus, effort: high, why: 'first real run of the install path, defects unknown' }
    facts: { 'brief': 'docs/v3/issues/ga/ga-install-path.json' }
  - key: ga-cli-formats
    issue: 3165
  - key: ga-peers
    issue: 3166
  - key: ga-agent-layer
    issue: 3167
  - key: ga-names
    title: 'One name per concept, American spelling, no deprecated alias, held by a glossary test'
    repo: basalt-ui
    kind: chore
    seat: { tier: opus, effort: high, why: 'a package-wide rename with codemods' }
    after: [ga-exports]
    after_needs: shipped
    facts: { 'brief': 'docs/v3/issues/ga/ga-names.json' }
  - key: ga-typed-nav
    title: 'AppShell typed by defineNav, a guarded navTarget, a page entry without the router, one series seam'
    repo: basalt-ui
    kind: chore
    seat: { tier: opus, effort: high, why: 'type-level design that cannot be narrowed after 3.0' }
    after: [ga-exports]
    after_needs: shipped
    facts: { 'brief': 'docs/v3/issues/ga/ga-typed-nav.json' }
  - key: ga-site-path
    title: 'init --profile site leaves a building Astro site with its own agent set; a dead island fails the build'
    repo: basalt-ui
    kind: feature
    seat: { tier: opus, effort: high, why: 'a new guard and a new agent set for the site profile' }
    after: [ga-cli-formats, ga-agent-layer, ga-install-path]
    after_needs: shipped
    facts: { 'brief': 'docs/v3/issues/ga/ga-site-path.json' }
  - key: ga-site-pages
    title: 'Guide, article, post list and changelog as recipes on shipped site parts, used by the marketing site'
    repo: basalt-ui
    kind: feature
    seat: { role: lead, moveUp: true }
    lane: browser
    after: [ga-site-path]
    after_needs: shipped
    facts: { 'brief': 'docs/v3/issues/ga/ga-site-pages.json' }
  - key: ga-playground-tour
    title: 'The playground opens on a tour of twelve pages on current patterns; superseded pages are gone'
    repo: basalt-ui
    kind: chore
    seat: { tier: opus, effort: high, why: 'curation and rebuilds the owner judges by eye' }
    lane: browser
    after: [ga-install-path]
    after_needs: shipped
    facts: { 'brief': 'docs/v3/issues/ga/ga-playground-tour.json' }
  - key: ga-seams
    title: 'Typed seams: table layout specs, palette sources, record steps on a page, three column kinds, a typed chart mark'
    repo: basalt-ui
    kind: feature
    seat: { tier: opus, effort: high, why: 'extension contracts that freeze' }
    lane: browser
    after: [ga-names]
    after_needs: shipped
    facts: { 'brief': 'docs/v3/issues/ga/ga-seams.json' }
  - key: ga-contract
    title: 'docs/v3/CONTRACT.md states what 3.0 freezes, under 25 KB, checked from the tree'
    repo: basalt-ui
    kind: docs
    seat: { role: lead, moveUp: true }
    after: [ga-exports, ga-names, ga-typed-nav, ga-cli-formats, ga-peers, ga-site-path, ga-seams]
    after_needs: shipped
    facts: { 'brief': 'docs/v3/issues/ga/ga-contract.json' }
