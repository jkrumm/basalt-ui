# Lefthook Configuration
min_version: 1.7.0

pre-commit:
  parallel: true
  commands:
    # Keeps the npm-published package's commits free of consumer-app changes (apps/playground,
    # apps/marketing) so the release path filter + changelog stay clean. .oxlintrc.json and tests/
    # are the package's own generated output/drift-gates; bunfig.toml, the root package.json, and
    # bun.lock are the root-level test-harness surface (DOM test preload config + the shared
    # devDependencies it needs — happy-dom, @testing-library/*, react/react-dom — since Bun
    # workspaces put those at the repo root, not per-package) — all allowed alongside it for the
    # same reason tests/ is.
    isolated-basalt-ui:
      run: |
        STAGED=$(git diff --cached --name-only)
        HAS_BASALT=$(echo "$STAGED" | grep -q '^packages/basalt-ui/' && echo 1 || echo 0)
        HAS_OTHER=$(echo "$STAGED" | grep -v '^packages/basalt-ui/' | grep -v '^\.oxlintrc\.json$' | grep -v '^tests/' | grep -v '^bunfig\.toml$' | grep -v '^package\.json$' | grep -v '^bun\.lock$' | grep -v '^$' | head -1)
        if [ "$HAS_BASALT" = "1" ] && [ -n "$HAS_OTHER" ]; then
          echo "❌ packages/basalt-ui must be committed separately from other changes"
          echo "   Found: $HAS_OTHER"
          exit 1
        fi

    check-theme:
      glob: 'packages/basalt-ui/src/**'
      # Run inside the package so its own `basalt` config (roots: ["src"] + framework-internal
      # rule opt-outs) applies — from the repo root the CLI sees no config and scans nothing.
      run: cd packages/basalt-ui && bun bin/basalt-ui.mjs check-theme

    oxlint:
      glob: '*.{js,jsx,ts,tsx,cjs,mjs}'
      run: bunx oxlint {staged_files}

    # Must cover every type `bun run fmt:check` reaches, or the hook passes and CI fails on the same
    # commit — oxfmt formats css/md/yaml too. The --ignore-path flags mirror the root scripts and are
    # load-bearing here in a way they are not there: this command WRITES (and re-stages), so without
    # them it would reformat tests/fixtures/palette-default.css, whose byte-for-byte content is the
    # thing tests/palette-css.test.ts pins. The hook would break the test it just staged.
    oxfmt:
      glob: '*.{js,jsx,ts,tsx,cjs,mjs,css,json,md,yml,yaml}'
      run: bunx oxfmt --ignore-path=.gitignore --ignore-path=.oxfmtignore {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
