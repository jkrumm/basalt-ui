# Lefthook Configuration
min_version: 1.7.0

pre-commit:
  parallel: true
  commands:
    # Keeps the npm-published package's commits free of consumer-app changes (apps/playground,
    # apps/expression, apps/marketing) so the release path filter + changelog stay clean. .oxlintrc.json and tests/
    # are the package's own generated output/drift-gates; bunfig.toml, the root package.json, and
    # bun.lock are the root-level test-harness surface (DOM test preload config + the shared
    # devDependencies it needs — happy-dom, @testing-library/*, react/react-dom — since Bun
    # workspaces put those at the repo root, not per-package) — all allowed alongside it for the
    # same reason tests/ is.
    isolated-basalt-ui:
      run: |
        STAGED=$(git diff --cached --name-only)
        HAS_BASALT=$(echo "$STAGED" | grep -q '^packages/basalt-ui/' && echo 1 || echo 0)
        HAS_OTHER=$(echo "$STAGED" | grep -v '^packages/basalt-ui/' | grep -v '^\.oxlintrc\.json$' | grep -v '^tests/' | grep -v '^bunfig\.toml$' | grep -v '^package\.json$' | grep -v '^bun\.lock$' | grep -v '^$' | head -1)
        if [ "$HAS_BASALT" = "1" ] && [ -n "$HAS_OTHER" ]; then
          echo "❌ packages/basalt-ui must be committed separately from other changes"
          echo "   Found: $HAS_OTHER"
          exit 1
        fi

    # The factory reads docs/plan.yaml from master and files no row while it fails this check
    # (2026-11-12: a 22-key `after` stalled the whole plan). Offline; skipped where the CLI is absent.
    plan-check:
      glob: 'docs/plan.yaml'
      run: command -v factory >/dev/null 2>&1 || exit 0; git show :docs/plan.yaml | factory plan check -

    # Two runs, as in `bun run lint`: the playground's config loads the v3 plugin and the root's the
    # 2.x one, both registered as `basalt`, so one oxlint process cannot load both.
    oxlint:
      glob: '*.{js,jsx,ts,tsx,cjs,mjs}'
      run: bunx oxlint --ignore-pattern 'apps/playground/**' --ignore-pattern 'apps/expression/**' --no-error-on-unmatched-pattern {staged_files}

    oxlint-playground:
      root: 'apps/playground/'
      glob: '*.{js,jsx,ts,tsx,cjs,mjs}'
      run: bunx oxlint --deny-warnings --report-unused-disable-directives --no-error-on-unmatched-pattern {staged_files}

    oxlint-expression:
      root: 'apps/expression/'
      glob: '*.{js,jsx,ts,tsx,cjs,mjs}'
      run: bunx oxlint --deny-warnings --report-unused-disable-directives --no-error-on-unmatched-pattern {staged_files}

    # Must cover every type `bun run fmt:check` reaches, or the hook passes and CI fails on the same
    # commit — oxfmt formats css/md/yaml too. The --ignore-path flags mirror the root scripts and are
    # load-bearing here in a way they are not there: this command WRITES (and re-stages), so without
    # them it would reformat tests/fixtures/palette-default.css, whose byte-for-byte content is the
    # thing tests/palette-css.test.ts pins. The hook would break the test it just staged.
    oxfmt:
      glob: '*.{js,jsx,ts,tsx,cjs,mjs,css,json,md,yml,yaml}'
      # --no-error-on-unmatched-pattern: oxfmt exits 2 when EVERY staged file is excluded by the
      # ignore paths above, so a commit touching only palette-default.css was impossible. The
      # shipped preset already carries this flag; this file did not.
      run: bunx oxfmt --ignore-path=.gitignore --ignore-path=.oxfmtignore --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
