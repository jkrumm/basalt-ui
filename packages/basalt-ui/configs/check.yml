# basalt-ui consumer CI seed — placed at .github/workflows/check.yml by `basalt-ui init`,
# then owned by the consumer (sync never touches it again). Mirrors the basalt-ui gate
# order: frozen install -> lint + theme guard -> doctrine drift gate -> format check.
# `basalt-ui check-theme` is the palette guard shipped by basalt-ui (fails on raw
# color literals / off-identity accents that bypass the --vx-* token system).
# `basalt-ui sync --check` fails when the basalt-managed files (rules, skills, the
# CLAUDE block) have drifted from the installed basalt-ui version.
# The oxfmt globs below are rendered from `basalt.roots` at init time — `init` writes that
# key from the repo's real layout (workspace packages included), so a monorepo does not
# seed a `src/**` that matches nothing.
# The basalt-ui command below is the LOCAL bin, rendered from where basalt actually
# installed. `bunx basalt-ui` is deliberately not used: when the package is not resolvable
# from the working directory (bun's isolated linker puts it beside the package that depends
# on it, not at the root) bunx silently downloads a DIFFERENT copy from npm and the gate
# runs a version nobody pinned.
name: check
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx oxlint .
      - run: '{{BASALT_BIN}} doctor'
      - run: '{{BASALT_BIN}} check-theme'
      - run: '{{BASALT_BIN}} sync --check'
      - run: bunx oxfmt {{ROOTS_GLOBS}} '!**/dist/**' --check
      # Enable once your app defines these package.json scripts:
      # - run: bun run typecheck
      # - run: bun run test
