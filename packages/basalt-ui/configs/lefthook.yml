# basalt-ui consumer lefthook preset — an `extends` target, not a copy.
# `basalt-ui init` seeds a lefthook.yml that references this file:
#   extends:
#     - node_modules/basalt-ui/configs/lefthook.yml
# lefthook merges these commands with the consumer's own, so this preset auto-updates
# with the package. Runs oxlint + oxfmt on staged files and the theme guard on the whole
# tree, pre-commit. Assumes oxlint/oxfmt are installed.
#
# It does NOT assume your `.oxlintrc.json` extends the shipped preset — that assumption was
# false for exactly the repos this seed exists for, since `init` KEEPS an existing oxlint
# config. `basalt-ui doctor` now checks the extends and hard-fails when it is missing; run it
# in CI (the seeded check.yml does) rather than trusting a comment nobody reads.
#
# `init` seeds the path RESOLVED from where basalt actually installed. Under bun's isolated
# linker basalt lives beside the package that depends on it, not at the repo root, and a
# root-relative `extends` there resolves to nothing — silently, because lefthook merges an
# empty file without complaint.
pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: '*.{ts,tsx,js,jsx}'
      run: bunx oxlint {staged_files}
    # `css` is load-bearing, not tidiness: oxfmt formats stylesheets, so without it a CSS-only
    # commit passes the hook and then fails the same check in CI. `oxlint` above deliberately
    # stops at JS — it has nothing to say about CSS.
    oxfmt:
      glob: '*.{ts,tsx,js,jsx,css,json,md,yml,yaml}'
      run: bunx oxfmt --check {staged_files}

    # NO glob, deliberately. This command scans the configured `basalt.roots` — it never reads
    # {staged_files} — so any glob here is a gate on WHETHER the guard runs, decided by the file
    # extensions that happen to be in one commit. It shipped as `*.{ts,tsx}`, which meant a commit
    # touching only CSS modules skipped the guard entirely; the guard reads CSS (raw-hex,
    # inline-spacing, raw-font-family and the surface kinds all fire there), so the rule was
    # invisible to the hook meant to enforce it. That is precisely the failure the next sentence
    # was written against: a guard that only runs when someone remembers to run it is not a guard.
    # Without this, a consumer accumulates violations indefinitely while `check-theme` is never
    # invoked, and the kinds it never ran are indistinguishable from the kinds that found nothing.
    #
    # Lefthook runs commands at the REPO ROOT, while in a monorepo the `basalt` config and the
    # manifest live in a package below it — verified to produce `0 files scanned`, i.e. following
    # this preset installed a gate that never gated. `check-theme` now relocates to the single
    # workspace package carrying a basalt config and says so; with more than one, set BASALT_CWD
    # in your own lefthook.yml to name the package:
    #   pre-commit:
    #     commands:
    #       check-theme:
    #         env: { BASALT_CWD: apps/web }
    check-theme:
      run: bunx basalt-ui check-theme
