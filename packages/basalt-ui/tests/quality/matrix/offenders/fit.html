<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>offender: fit</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.4 system-ui,
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        padding: 16px;
      }
      button,
      a {
        font: inherit;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: 2px;
      }
      .cut {
        width: 80px;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>fit</h1>
      <div class="cut">A very long label that is cut off</div>
    </main>
  </body>
</html>
