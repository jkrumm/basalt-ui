<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>offender: ring-clipped</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.4 system-ui,
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        padding: 16px;
      }
      button,
      a {
        font: inherit;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: 2px;
      }
      .box {
        overflow: hidden;
        width: 80px;
        height: 48px;
      }
      .box button {
        width: 80px;
        height: 48px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ring-clipped</h1>
      <div class="box"><button type="button">Clipped</button></div>
    </main>
  </body>
</html>
