<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>offender: ring-group-thin</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.4 system-ui,
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        padding: 16px;
      }
      button,
      a {
        font: inherit;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: 2px;
      }
      .group {
        display: flex;
        width: 240px;
        margin: 8px;
        border: 1px solid #555;
        background: #fff;
      }
      .group input {
        flex: 1;
        min-width: 0;
        min-height: 48px;
        border: 0;
        font: inherit;
        outline: none;
      }
      .group:has(:focus-visible) {
        outline: 1px solid #1d4ed8;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ring-group-thin</h1>
      <div class="group"><input type="text" aria-label="Grouped" /></div>
    </main>
  </body>
</html>
