<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>offender: ring-translucent</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.4 system-ui,
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        padding: 16px;
      }
      button,
      a {
        font: inherit;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: 2px;
      }
      button:focus-visible {
        outline: 2px solid rgb(29 78 216 / 0.3);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ring-translucent</h1>
      <button type="button" style="min-width: 48px; min-height: 48px">Faint ring</button>
    </main>
  </body>
</html>
