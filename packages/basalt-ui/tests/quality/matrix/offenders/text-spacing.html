<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>offender: text-spacing</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.4 system-ui,
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        padding: 16px;
      }
      button,
      a {
        font: inherit;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: 2px;
      }
      .cell {
        width: 100px;
        height: 1.4em;
        overflow: hidden;
        white-space: nowrap;
        background: #eee;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>text-spacing</h1>
      <div class="cell">Hello world</div>
    </main>
  </body>
</html>
