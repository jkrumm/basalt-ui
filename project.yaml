apiVersion: factory/v2
name: basalt-ui
deploy:
  mode: none
ship:
  - via: pr
# No repo cap (NL32): the factory's memory fit, load rule and test slots, the `browser` lane and the `after` edges
# decide how many leads really run.
# A lead runs `make check-fast` (the whole of `make check` but the layout and unit suites, which run only the files the
# branch's changes reach: scripts/layout-select.ts, scripts/unit-select.ts). CI covers the whole of `make check` on the pull
# request head as parallel jobs (checks, unit, the layout suite sharded four ways, the quality matrix, and `make check CI_SPLIT=1` for the steps no other
# job runs; docs/validation.md), each step once, and `make merge-guard` demands that run green.
checks: { fast: make check-fast, full: make check, ci: true }
# 60m dates from a `make check-fast` that ran the whole sampled matrix (394 cells, ~30 min under host load, 2026-11-21).
# Since Issue 2949 it runs only the cells and Astro parts a branch reaches (scripts/matrix-select.ts: 48 cells at most, the
# 24-cell smoke set for a shared change); this returns to 30m once the p90 of `check-fast` reads under it.
slots: { run: 60m }
# The layout suite is a Chrome tree. Its context-per-test close keeps one run near 2.5 GB resident, under the 3 GiB
# reservation below. A row that adds browser work files itself `lane: browser`; admission reserves `memory` per
# running lead against the host ceiling, so memory holds them back. The lane has no cap of its own: `leads: 64` is the host bound.
lanes:
  browser:
    leads: 64
    memory: 3GiB
# The unit suite may run on the factory's step host when the mini's test line would make it wait longer (Makefile
# `test`, `$(call slot,unit)`). Measured 2026-11-17: 187 s on the host in parallel against 412 s on the mini.
# `browser`: the shot harness's real-Chrome tests launch the `chrome` channel; the repo's image carries Chrome and Node
# (tools/step-image/Dockerfile). `network`: tests/live/poller/query-5101 installs its own pinned Query core with
# `bun install --frozen-lockfile` at test time. `carry`: the suite reads the built package (`make build`) from dist.
steps:
  unit:
    make: test
    needs: [browser, network]
    remote: true
    dockerfile: tools/step-image/Dockerfile
    carry: [packages/basalt-ui/dist]
